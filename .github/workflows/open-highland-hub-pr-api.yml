name: Open Highland hub PR (Contents API)

on:
  workflow_dispatch:
    inputs:
      repos:
        description: "Comma-separated BRYNTLY-ORG repos. ERMT first."
        required: true
        default: "ERMT,ERM"
      fleet_token:
        description: "Optional one-run PAT (fine-grained or <366-day classic; Contents + PRs on ERMT/ERM). Leave empty to use FLEET_GITHUB_TOKEN. Visible on this run page — use a 1-day token."
        required: false
        type: string
        default: ""

jobs:
  open-prs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout restore kit
        uses: actions/checkout@v4
      - name: Patch quote-native.ts via Contents API and open PRs
        env:
          INPUT_TOKEN: ${{ inputs.fleet_token }}
          SECRET_TOKEN: ${{ secrets.FLEET_GITHUB_TOKEN }}
          REPOS: ${{ inputs.repos }}
        run: |
          set -euo pipefail
          GH_TOKEN="${INPUT_TOKEN:-${SECRET_TOKEN:-}}"
          if [[ -n "${GH_TOKEN}" ]]; then
            echo "::add-mask::${GH_TOKEN}"
          fi
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "Paste fleet_token on this run, or add repo secret FLEET_GITHUB_TOKEN (fine-grained or <366-day PAT, Contents + PRs on ERMT and ERM)." >&2
            exit 2
          fi
          export GH_TOKEN
          python3 open-highland-hub-pr-via-api.py
