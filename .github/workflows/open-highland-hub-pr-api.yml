name: Open Highland hub PR (Contents API)

on:
  push:
    paths:
      - FORCE_HUB_OPEN
  workflow_dispatch:
    inputs:
      repos:
        description: "Comma-separated BRYNTLY-ORG repos. ERMT first."
        required: true
        default: "ERMT,ERM,LDMT,MOO_COW,ERM_FORM"
      fleet_token:
        description: "1-day PAT with Contents + PRs on the five quote apps. Leave empty to use FLEET_GITHUB_TOKEN. Visible on this run page."
        required: false
        type: string
        default: ""

jobs:
  open-prs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout restore kit
        uses: actions/checkout@v4
      - name: Patch quote-native.ts via Contents API and open PRs
        env:
          INPUT_TOKEN: ${{ github.event_name == 'workflow_dispatch' && inputs.fleet_token || '' }}
          SECRET_TOKEN: ${{ secrets.FLEET_GITHUB_TOKEN }}
          REPOS: ${{ github.event_name == 'workflow_dispatch' && inputs.repos || 'ERMT,ERM,LDMT,MOO_COW,ERM_FORM' }}
          HUB_BRANCH: cursor/quote-pipeline-stack-610b
        run: |
          set -euo pipefail
          GH_TOKEN="${INPUT_TOKEN:-${SECRET_TOKEN:-}}"
          if [[ -n "${GH_TOKEN}" ]]; then
            echo "::add-mask::${GH_TOKEN}"
          fi
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "No fleet_token / FLEET_GITHUB_TOKEN. Do not use this push path." >&2
            echo "On Desktop (you already have /Users/pacman/GITHUB_ACTUAL):" >&2
            echo "  gh repo clone Bryntly/open-atlanta-hub-pr /tmp/hub-kit && cd /tmp/hub-kit" >&2
            echo "  bash ./stack-from-github-actual.sh" >&2
            echo "Or re-run this workflow with a 1-day PAT in fleet_token (all five apps)." >&2
            exit 2
          fi
          export GH_TOKEN
          bash open-highland-hub-pr-via-gh.sh
